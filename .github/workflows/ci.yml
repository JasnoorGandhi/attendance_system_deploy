name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff

      - name: Run ruff (lint)
        run: ruff check . --exit-zero
        # exit-zero for now so CI is informative, not blocking, while the
        # codebase is still evolving — flip to a hard fail once stable

      - name: Check Python syntax compiles
        run: |
          python -m py_compile main.py database.py auth.py models.py
          python -m py_compile ml/*.py routers/*.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build (catches syntax/import errors)
        run: npm run build
